# Example community Blueprint. Copy this file into your own contributor folder
# (community/<your-handle>/blueprints/) and adapt it. See CONTRIBUTING.md.
#
# Community blueprints are NOT supported by SUSE. Users install them at their
# own risk; the maintainer annotation tells them who to ask for help.
#
# Conventions the CI enforces:
#   * filename must be <blueprint-name>-<version>.yaml
#   * metadata.name must be <blueprint-name>-<version> with dots -> dashes
#   * the two blueprint-* labels must match the filename and spec.version
#   * the ai-factory.suse.com/maintainer annotation must be set
#   * spec.source must be "Custom" for community blueprints (a dedicated
#     "Community" source is planned in SUSE AI Factory; CI will switch to it)
#   * spec.icon is optional; if set it must be an https:// URL on a public
#     hostname or a base64 png/gif/jpeg/webp data: URI (max 16384 chars).
#     Prefer a data: URI so the logo also shows in air-gapped installs.
---
apiVersion: ai-factory.suse.com/v1alpha1
kind: Blueprint
metadata:
  name: example-chatbot-1-0-0
  labels:
    ai-factory.suse.com/blueprint-name: example-chatbot
    ai-factory.suse.com/blueprint-version: 1.0.0
    # Optional: adds this blueprint to a category in the aggregate catalog.
    ai-factory.suse.com/category: rag
  annotations:
    # Required: GitHub handle, email or URL of whoever maintains this blueprint.
    ai-factory.suse.com/maintainer: https://github.com/example
spec:
  source: Custom
  # Optional logo, shown beside the source badge on the blueprint card.
  # icon: data:image/png;base64,iVBORw0KGgo...
  displayName: Example Chatbot
  version: 1.0.0
  description: |
    A minimal single-component example blueprint used as a template for
    community submissions. Replace the component(s) below with your own Helm
    charts and values. Keep the description accurate: prerequisites
    (StorageClass, cert-manager, GPUs), exposed endpoints, and any licensing
    notes belong here. Community blueprints are not supported by SUSE.
  components:
    - chartName: open-webui
      chartRepo: application-collection
      chartVersion: 8.19.1
      values:
        image:
          registry: dp.apps.rancher.io
          repository: containers/open-webui
        persistence:
          enabled: true
          size: 20Gi
        ingress:
          enabled: true
          host: example-chatbot
          tls: true
